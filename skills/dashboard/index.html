<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard</title>
<style>
:root {
  --bg: #0c0c0c; --panel: #111111; --raised: #181818; --line: #282828; --line2: #383838;
  --text: #d4d4d4; --head: #f2f2f2; --label: #8c8c8c; --dim: #5f5f5f; --arch: #454545;
  --clay: #d97757; --clay-line: #6b4234; --sel: #1e1714;
  --run: #4eba65; --wait: #e0a846; --err: #ef6464;
  --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, monospace;
  --fs: 15px; --fs-s: 13.5px; --fs-xs: 12.5px;
  --rad: 9px;
  /* row geometry: left pad, cursor gutter, gap -> content column */
  --rp: 10px; --gw: 12px; --gap: 9px; --c1: calc(var(--rp) + var(--gw) + var(--gap));
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; overflow: hidden; background: var(--bg); color: var(--text);
  font: var(--fs)/1.5 var(--mono); -webkit-font-smoothing: antialiased; }
::selection { background: #4a2b20; }
* { scrollbar-width: thin; scrollbar-color: var(--line2) transparent; }
a { color: var(--clay); }
button, textarea { font-family: var(--mono); }
#app { display: grid; grid-template-rows: 46px 1fr 38px; height: 100vh; }

/* bars */
.top { display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 0 20px;
  border-bottom: 1px solid var(--line); font-size: var(--fs-s); color: var(--label); min-width: 0; }
.crumbs { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.crumbs .brand { color: var(--clay); margin-right: 12px; }
.crumbs .pr { color: var(--dim); margin-right: 8px; }
.crumbs a { color: var(--label); text-decoration: none; cursor: pointer; transition: color 100ms; }
.crumbs a:hover { color: var(--head); }
.crumbs .sep { color: var(--arch); margin: 0 9px; }
.crumbs .cur { color: var(--head); }
.crumbs .id { color: var(--clay); }
.meta { display: flex; gap: 20px; white-space: nowrap; align-items: center; }
.meta .run { display: inline-flex; align-items: center; gap: 4px; }
.bottom { display: flex; align-items: center; gap: 22px; padding: 0 20px; border-top: 1px solid var(--line);
  font-size: var(--fs-xs); color: var(--dim); white-space: nowrap; overflow: hidden; }
.bottom span { color: var(--label); }
kbd { font: inherit; color: var(--clay); margin-right: 7px; }

main { min-height: 0; padding: 15px 20px; overflow: hidden; }
.screen { height: 100%; min-height: 0; display: flex; flex-direction: column; gap: 15px; }

/* panels */
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--rad); display: flex;
  flex-direction: column; min-height: 0; min-width: 0; transition: border-color 120ms; }
.panel.focused { border-color: var(--clay-line); }
.label { font-size: var(--fs-s); line-height: 1.2; color: var(--label); padding: 14px 15px 8px;
  display: flex; gap: 10px; align-items: baseline; }
.label .r { margin-left: auto; color: var(--dim); }
.scroll { overflow: auto; min-height: 0; flex: 1; padding-bottom: 10px; }
.empty { padding: 4px 15px 4px var(--c1); color: var(--dim); }
.errtext { padding: 5px 15px 5px var(--c1); color: var(--err); white-space: pre-wrap; word-break: break-word; }
.status { padding: 5px 15px 5px var(--c1); color: var(--label); }

.row { display: flex; align-items: center; gap: var(--gap); padding: 6px 15px 6px var(--rp);
  transition: background-color 100ms; cursor: pointer; min-width: 0; }
.row::before { content: ''; width: var(--gw); flex: none; color: var(--clay); }
.row:hover { background: #151515; }
.row.sel { background: var(--sel); }
.row.sel::before { content: '❯'; }
.row .t { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row.sel .t { color: var(--head); }
.row .k { color: var(--clay); width: 1ch; flex: none; }
.row .k.off { color: var(--dim); }
.id { color: var(--clay); flex: none; }
.tag { font-size: var(--fs-s); color: var(--label); flex: none; white-space: nowrap; }
.tag.block { color: var(--wait); }
.tag.urgent, .tag.fail { color: var(--err); }
.tag.prog { color: var(--run); }
/* ⏺ status glyph; the class sets its colour */
.dot { flex: none; display: inline-block; width: 1.1em; text-align: center; font-size: 1em; line-height: 1; color: var(--arch); }
.dot::before { content: '\23FA\FE0E'; }
.dot.running { color: var(--run); } .dot.waiting { color: var(--wait); }
.dot.archived { color: var(--arch); } .dot.error, .dot.sentry { color: var(--err); }
.dot.jira { color: var(--label); } .dot.dependabot { color: var(--wait); } .dot.other { color: var(--text); }
.dot.note { color: var(--label); } .dot.note::before { content: '\25CB'; }
.dot.pr-open { color: var(--run); } .dot.pr-draft { color: var(--label); } .dot.pr-merged { color: #a78bfa; } .dot.pr-closed { color: var(--err); }
.line { display: flex; gap: var(--gap); align-items: baseline; padding: 4px 15px 4px calc(var(--c1) - 2px); min-width: 0; }
.line .tx { flex: 1; min-width: 0; word-break: break-word; }
.line .n { color: var(--clay); flex: none; }
code { font-family: var(--mono); font-size: .92em; background: var(--raised); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; }
.section { min-width: 0; }
.section + .section { border-top: 1px solid var(--line); }

/* home */
.today { flex: none; display: flex; align-items: center; gap: 12px; height: 46px; padding: 0 18px; min-width: 0;
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--rad); white-space: nowrap; }
.today .spark { color: var(--clay); flex: none; }
.today .lbl { color: var(--head); flex: none; }
.today .tl { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; color: var(--text); }
.today .tl .s { color: var(--arch); margin: 0 .7em; }
.today .tl .n { color: var(--clay); margin-right: .5em; }
.today .tl .bad { color: var(--err); }
.today .tl .wait { color: var(--label); }
.today .r { flex: none; color: var(--dim); font-size: var(--fs-s); }
.cols { flex: 1; display: grid; gap: 15px; min-height: 0; }
/* rows: head, tickets, to-do, jumps, spacer, sentry/dependabot */
.cols.proj { grid-template-rows: auto minmax(0, max-content) minmax(0, max-content) auto 1fr auto; row-gap: 0; overflow: hidden; }
.panel.proj { display: grid; grid-row: span 6; grid-template-rows: subgrid; min-width: 0; overflow: hidden; }
.panel.proj > .scroll { display: contents; }
.panel.proj > .label { padding: 15px 15px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.pname { color: var(--head); font-size: var(--fs); font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.panel.focused .pname { color: var(--clay); }
.pkey { color: var(--dim); }
.panel.proj .section.fill { overflow-y: auto; min-height: 0; }
.panel.proj .section > .label { position: sticky; top: 0; background: var(--panel); z-index: 1; }
.panel.proj .section:last-child { border-top: 1px solid var(--line); }
.sigs { padding: 8px 0 10px; }
.line.sig .tx { color: var(--text); }
.line.sig .n { color: var(--text); }
.line.sig.zero .tx, .line.sig.zero .n { color: var(--dim); }
.line.sig.zero .dot { color: var(--arch); } .line.sig.zero .dot::before { content: '\25CB'; }
.goal { padding: 0 15px 7px calc(var(--c1) + 1ch + var(--gap)); color: var(--label); font-size: var(--fs-s);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.goal::before, .tgoal::before { content: '\23BF  '; color: var(--dim); }
.page { color: var(--dim); }
.jump .k { width: auto; min-width: 1ch; }
.jump .arg { font-size: var(--fs-s); color: var(--dim); max-width: 45%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.jump.armed { background: #221b0f; }
.jump.armed::before { content: '❯'; color: var(--wait); }

/* ticket */
.head { flex: none; display: flex; align-items: baseline; gap: 14px; padding: 2px 4px 0; min-width: 0; }
.head .id { font-size: 19px; }
.head h1 { font-size: 19px; font-weight: 600; color: var(--head); margin: 0; flex: 1; min-width: 0;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tgoal { flex: none; padding: 0 4px; margin-top: -6px; color: var(--label); }
.two { flex: 1; display: grid; grid-template-columns: minmax(0, 0.85fr) minmax(0, 1.15fr); gap: 15px; min-height: 0; }
.step { display: flex; align-items: baseline; gap: var(--gap); padding: 4px 15px 4px calc(var(--c1) - 2px); color: var(--label); }
.step.done { color: var(--dim); } .step.done .dot { color: var(--arch); }
.step.now { color: var(--head); } .step.now .dot { color: var(--clay); }
.step.next .dot::before, .step.todo .dot::before { content: '\25CB'; }
.step.next .dot { color: var(--label); }
.step .cur { font-size: var(--fs-s); color: var(--clay); }
.text { padding: 3px 15px 5px var(--c1); white-space: pre-wrap; word-break: break-word; }
.text.dim { color: var(--label); }
.tree .conn { color: var(--arch); white-space: pre; flex: none; }
.tree .row { gap: 8px; }
.tree .st { font-size: var(--fs-s); color: var(--label); flex: none; }
.tree .when { font-size: var(--fs-s); color: var(--dim); flex: none; width: 8ch; text-align: right; }
.tree .summary { padding: 2px 15px 8px 0; color: var(--label); font-size: var(--fs-s); white-space: pre-wrap; display: flex; gap: .6em; }
.tree .summary::before { content: '\23BF'; color: var(--dim); flex: none; }


/* start */
#app.start { grid-template-rows: 1fr; }
#app.start .top, #app.start .bottom { display: none; }
.screen.start { align-items: center; justify-content: center; gap: 0; }
.clock { font-weight: 300; color: var(--head); font-size: min(15vw, 20vh); line-height: 1; letter-spacing: -.03em;
  font-variant-numeric: tabular-nums; display: flex; align-items: baseline; }
.clock .colon { color: var(--clay); }
.clock .sec { font-size: min(3vw, 4vh); color: var(--label); margin-left: .7em; letter-spacing: 0; }
.date { font-size: min(2.2vw, 3.2vh); color: var(--text); margin-top: 2vh; }
.date .spark { color: var(--clay); margin-right: .6em; }
.weather { margin-top: 4.5vh; display: flex; flex-direction: column; align-items: center; gap: 3.2vh; width: min(1200px, 92vw); }
.wnow { display: flex; align-items: center; gap: 26px; }
.wnow .ico { width: 76px; height: 76px; color: var(--text); }
.wnow .temp { font-size: 66px; font-weight: 300; color: var(--head); line-height: 1; font-variant-numeric: tabular-nums; }
.wnow .cond { color: var(--head); font-size: 19px; }
.wnow .place { font-size: var(--fs-s); color: var(--label); margin-bottom: 5px; }
.wsmall { font-size: var(--fs); color: var(--label); display: flex; gap: 24px; flex-wrap: wrap; justify-content: center; }
.wsmall b { color: var(--text); font-weight: 400; }
.hours { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); width: 100%; border: 1px solid var(--line);
  border-radius: var(--rad); background: var(--panel); padding: 14px 6px; }
.hours > div, .days > div { display: flex; flex-direction: column; align-items: center; gap: 7px; font-size: var(--fs); color: var(--label); }
.hours .ico, .days .ico { width: 28px; height: 28px; color: var(--text); }
.hours .tv, .days .tv { color: var(--head); }
.hours .pp { color: var(--dim); font-size: var(--fs-s); min-height: 1em; }
.days { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); width: 70%; }
.days .lo { color: var(--dim); }
.ico { display: inline-block; flex: none; }

/* toast + overlay */
#toast { position: fixed; right: 20px; bottom: 52px; max-width: 640px; background: var(--raised); border: 1px solid var(--line2);
  border-radius: var(--rad); padding: 10px 15px; font-size: var(--fs-s); color: var(--head); white-space: pre-wrap; word-break: break-word;
  display: none; z-index: 20; }
#toast.err { border-color: var(--err); color: #f4a5a5; }
#toast.show { display: block; }
#overlay { position: fixed; inset: 0; background: rgba(0, 0, 0, .75); display: none; align-items: center; justify-content: center; z-index: 10; }
#overlay.show { display: flex; }
#overlay .panel { width: min(1000px, 92vw); max-height: 86vh; border-color: var(--line2); }
#overlay .panel > .label { color: var(--head); padding-top: 18px; }
#overlay .panel > .label .spark { color: var(--clay); }
.keys { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 30px; padding: 0 0 15px; overflow: auto; }
.keys .row { cursor: default; padding: 4px 15px; font-size: var(--fs-s); }
.keys .row::before { display: none; }
.keys .row:hover { background: none; }
.keys .row { align-items: baseline; }
.keys .row .t { white-space: normal; }
.keys kbd { display: inline-block; min-width: 150px; flex: none; }
</style>
</head>
<body>
<div id="app">
  <header class="top"><div class="crumbs" id="crumbs"></div><div class="meta" id="meta"></div></header>
  <main id="main"></main>
  <footer class="bottom" id="hints"></footer>
</div>
<div id="toast"></div>
<div id="overlay"></div>
<script>
'use strict';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const PAGE = 3, TICKETS = 9;

const S = {
  route: { name: 'home' }, gen: 0, timer: null, overlay: false, armed: null,
  briefing: null, briefingErr: null, projects: null, projectsErr: null, focus: 0, homeSel: 0,
  ticket: null, ticketErr: null, ticketSel: 0, flat: [],
};

/* ---------- api ---------- */
async function api(path, body) {
  const opt = body === undefined ? {} : { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) };
  let res;
  try { res = await fetch(path, opt); } catch (e) { throw new Error(`${path}: ${e.message}`); }
  const txt = await res.text();
  let data = null;
  if (txt) {
    try { data = JSON.parse(txt); }
    catch { throw new Error(res.ok ? `${path}: response is not JSON` : `${res.status} ${txt}`); }
  }
  if (!res.ok) throw new Error(data && data.error ? data.error : `${path}: ${res.status} ${res.statusText}`);
  return data;
}

/* ---------- formatting ---------- */
function relTime(v) {
  if (v === null || v === undefined || v === '') return '';
  let t = typeof v === 'number' ? (v < 1e12 ? v * 1000 : v) : Date.parse(v);
  if (isNaN(t)) return '';
  const s = Math.max(0, (Date.now() - t) / 1000);
  if (s < 60) return 'now';
  if (s < 3600) return `${Math.floor(s / 60)}m ago`;
  if (s < 86400) return `${Math.floor(s / 3600)}h ago`;
  return `${Math.floor(s / 86400)}d ago`;
}
// Inline markdown on raw text: every segment is HTML-escaped before any tag is added.
function inline(s) {
  return String(s ?? '').split(/(`[^`\n]+`)/).map((seg, i) => i % 2
    ? `<code>${esc(seg.slice(1, -1))}</code>`
    : esc(seg)
        .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>')
        .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
  ).join('');
}
// Colour ticket ids in text outside of tags.
const hlIds = html => html.split(/(<[^>]+>)/).map(p => p.startsWith('<') ? p
  : p.replace(/\b([A-Z][A-Z0-9]+-\d+)\b/g, '<span class="id">$1</span>')).join('');
const dotLine = (kind, text) => {
  if (kind === 'note') {
    const m = String(text).match(/^#?(\d+)[.):]?\s+([\s\S]*)$/);
    if (m) return `<div class="line"><span class="n">#${esc(m[1])}</span><span class="tx">${hlIds(inline(m[2]))}</span></div>`;
  }
  return `<div class="line"><span class="dot ${esc(kind)}"></span><span class="tx">${hlIds(inline(text))}</span></div>`;
};

/* ---------- chrome: crumbs, clock, hints, toast, overlay ---------- */
function setCrumbs(parts) {
  $('#crumbs').innerHTML = '<span class="brand">✻</span><span class="pr">&gt;</span>' + parts.map((p, i) => {
    const last = i === parts.length - 1;
    const cls = (p.id ? 'id ' : '') + (last ? 'cur' : '');
    return (i ? '<span class="sep">/</span>' : '') +
      (last ? `<span class="${cls}">${esc(p.text)}</span>` : `<a class="${cls}" href="${esc(p.href)}">${esc(p.text)}</a>`);
  }).join('');
}
function updateMeta() {
  const d = new Date();
  const date = d.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' });
  const time = d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
  const running = (S.projects || []).reduce((n, p) => n + (p.running || 0), 0);
  $('#meta').innerHTML = `<span>${esc(date)}</span><span>${esc(time)}</span>` +
    `<span class="run"><span class="dot ${running ? 'running' : 'archived'}"></span>${running} running</span>`;
}
const HINTS = {
  start: [],
  home: [['↑↓', 'select'], ['space', 'open'], ['⏎', 'new session'], ['1–9', 'ticket'], ['← →', 'project'], ['⇧← →', 'move'], ['[ ]', 'page'], ['s', 'sentry'], ['d', 'dependabot'], ['r', 'refresh'], ['c', 'clock']],
  ticket: [['↑↓', 'select'], ['space', 'new /ticket session'], ['esc', 'back'], ['←', 'back']],
};
function updateHints() {
  let h = HINTS[S.route.name].slice();
  if (S.route.name === 'ticket' && S.flat.length) { h[1] = ['space', 'open session']; h = h.filter(([k]) => k !== '←'); }
  if (S.route.name === 'home') {
    const p = focusedProject();
    for (const j of (p && p.jumps) || []) h.push([j.key, j.label]);
  }
  if (S.route.name !== 'start') h = h.concat([['?', 'keys']]);
  $('#hints').innerHTML = h.map(([k, l]) => `<span><kbd>${esc(k)}</kbd>${esc(l)}</span>`).join('');
}
let toastTimer;
function toast(msg, isErr) {
  const t = $('#toast');
  t.textContent = msg;
  t.className = 'show' + (isErr ? ' err' : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.className = ''; }, isErr ? 8000 : 3000);
}
const fail = e => toast(e.message || String(e), true);
function toggleOverlay(force) {
  S.overlay = force === undefined ? !S.overlay : force;
  const o = $('#overlay');
  if (!S.overlay) { o.className = ''; return; }
  const groups = [
    ['everywhere', [['?', 'toggle this list'], ['esc / ⌫', 'back'], ['↑↓ / j k', 'move selection']]],
    ['start', [['any key or click', 'go to briefing (home)']]],
    ['home', [['space', 'open selected ticket'], ['⏎', 'blank new session in the project'], ['← / →', 'previous / next project'], ['s', 'new session: fix new Sentry errors'], ['d', 'new session: Dependabot review'], ['c', 'clock screen'], ['tab / p', 'next project (⇧tab back)'], ['⇧← / ⇧→, H / L', 'move project left / right'], ['[ / ]', 'previous / next 3 projects'], ['1–9', 'open to-do ticket 1–9'], ['r', 'refresh briefing'], ['jump key', 'run jump (to-do done: press twice)']]],
    ['ticket', [['↑↓ / j k', 'select session'], ['space', 'open the selected session in the app; no sessions yet: new session with /ticket <id> prefilled']]],
  ];
  const p = focusedProject();
  if (p && (p.jumps || []).length) groups.push([`jumps · ${p.name}`, p.jumps.map(j => [j.key, j.label])]);
  o.innerHTML = `<div class="panel"><div class="label"><span class="spark">✻</span>keys</div><div class="keys">${groups.map(([g, ks]) =>
    `<div><div class="label">${esc(g)}</div>${ks.map(([k, l]) => `<div class="row"><kbd>${esc(k)}</kbd><span class="t">${esc(l)}</span></div>`).join('')}</div>`
  ).join('')}</div></div>`;
  o.className = 'show';
}

/* ---------- routing ---------- */
function parseHash() {
  if (location.hash === '' || location.hash === '#' || location.hash === '#/start') return { name: 'start' };
  const parts = location.hash.replace(/^#\/?/, '').split('/').filter(Boolean).map(decodeURIComponent);
  if (parts[0] === 'ticket' && parts.length >= 3) return { name: 'ticket', project: parts[1], id: parts.slice(2).join('/') };
  return { name: 'home' };
}
const ticketHash = (project, id) => `#/ticket/${encodeURIComponent(project)}/${encodeURIComponent(id)}`;
function go(h) { if (location.hash === h) route(); else location.hash = h; }
function back() {
  const r = S.route;
  if (r.name === 'ticket') go('#/');
}
function route() {
  clearTimeout(S.timer);
  clearTimeout(S.wTimer);
  S.gen++;
  S.armed = null;
  S.route = parseHash();
  const r = S.route;
  $('#app').classList.toggle('start', r.name === 'start');
  if (r.name === 'start') { renderStart(); loadWeather(); loadHome(); }
  else if (r.name === 'home') { setCrumbs([{ text: 'home' }]); renderHome(); loadHome(); }
  else if (r.name === 'ticket') {
    setCrumbs([{ text: 'home', href: '#/' }, { text: r.id, id: true }]);
    if (!S.ticket || S.ticket.id !== r.id) { S.ticket = null; S.ticketSel = 0; S.flat = []; }
    S.ticketErr = null; renderTicket(); loadTicket();
  }
  updateHints();
}

/* ---------- home ---------- */
const focusedProject = () => (S.projects || [])[S.focus];
const pageStart = () => Math.floor(S.focus / PAGE) * PAGE;
function homeItems(p) {
  if (!p) return [];
  return (p.next || []).slice(0, TICKETS).map((t, i) => ({ ...t, num: i + 1 }));
}
// Home data is global: fetched on the start screen too, so home is ready when Quinn gets there.
function loadHome() { loadProjects(); loadBriefing(S.gen); }
async function loadProjects() {

  if (!w) { el.innerHTML = '<div class="status">loading weather…</div>'; return; }
  const cur = w.current || {}, td = w.today || {};
  const sr = hhmm(td.sunrise), ss = hhmm(td.sunset);
  const night = t => { const h = hhmm(t); return sr && ss && h ? (h < sr || h >= ss) : false; };
  const small = [
    `gefühlt <b>${deg(cur.apparentTemp)}</b>`,
    `<b>${deg(td.min)}</b> / <b>${deg(td.max)}</b>`,
    cur.windKmh !== undefined ? `Wind <b>${Math.round(cur.windKmh)} km/h</b>` : '',
    td.precipProbMax !== undefined ? `Regen <b>${Math.round(td.precipProbMax)}%</b>` : '',
    sr || ss ? `↑ <b>${esc(sr)}</b>  ↓ <b>${esc(ss)}</b>` : '',
  ].filter(Boolean);
  const hours = (w.hours || []).slice(0, 12).map(h => `<div><span>${esc(hhmm(h.time).slice(0, 2))}</span>${wIcon(h.code, !night(h.time))}
    <span class="tv">${deg(h.temp)}</span><span class="pp">${h.precipProb ? esc(Math.round(h.precipProb)) + '%' : ''}</span></div>`).join('');
  const days = (w.daily || []).slice(0, 4).map((d, i) => {
    const name = i === 0 && String(d.date).slice(0, 10) === new Date().toLocaleDateString('sv-SE') ? 'Heute'
      : new Date(String(d.date).slice(0, 10) + 'T12:00').toLocaleDateString('de-DE', { weekday: 'short' }).replace('.', '');
    return `<div><span>${esc(name)}</span>${wIcon(d.code)}<span><span class="tv">${deg(d.max)}</span> <span class="lo">${deg(d.min)}</span></span></div>`;
  }).join('');
  el.innerHTML = `<div class="wnow">${wIcon(cur.code, cur.isDay !== false && cur.isDay !== 0)}<span class="temp">${deg(cur.temp)}</span>
      <div><div class="place">${esc(w.place || '')}</div><div class="cond">${esc(cur.text || '')}</div></div></div>
    <div class="wsmall">${small.map(s => `<span>${s}</span>`).join('')}</div>
    ${hours ? `<div class="hours">${hours}</div>` : ''}
    ${days ? `<div class="days">${days}</div>` : ''}`;
}
async function loadWeather() {
  const gen = S.gen;
  try { S.weather = await api('/api/weather'); S.weatherErr = null; }
  catch (e) { S.weatherErr = e.message; }
  if (gen !== S.gen) return;
  renderStart();
  S.wTimer = setTimeout(loadWeather, 10 * 60 * 1000);
}
/* ---------- input ---------- */
document.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (S.route.name === 'start') { e.preventDefault(); go('#/'); return; }
  if (e.key === '?') { e.preventDefault(); toggleOverlay(); return; }
  if (S.overlay) {
    if (e.key === 'Escape' || e.key === 'Backspace') { e.preventDefault(); toggleOverlay(false); }
    return;
  }
  if (e.key === 'Escape' || e.key === 'Backspace') { e.preventDefault(); back(); return; }
  const handler = { home: homeKey, ticket: ticketKey }[S.route.name];
  if (handler(e)) e.preventDefault();
});
document.addEventListener('click', e => {
  if (S.route.name === 'start') { go('#/'); return; }
  if (S.overlay) { if (!e.target.closest('#overlay .panel')) toggleOverlay(false); return; }
  const el = e.target.closest('[data-act]');
  if (!el || e.target.closest('a[href^="http"]')) return;
  const a = el.dataset.act;
  if (a === 'ticket') {
    S.focus = Number(el.closest('[data-idx]').dataset.idx);
    S.homeSel = Math.max(0, homeItems(focusedProject()).findIndex(t => t.id === el.dataset.id));
    openTicket(el.dataset.project, el.dataset.id);
  } else if (a === 'jump') runJump(Number(el.dataset.idx), el.dataset.key);
  else if (a === 'focus') { if (Number(el.dataset.idx) !== S.focus) focusProject(Number(el.dataset.idx)); }
  else if (a === 'session') { S.ticketSel = Number(el.dataset.i); renderTicket(); }
});
window.addEventListener('hashchange', route);
updateMeta();
setInterval(updateMeta, 10000);
setInterval(tickClock, 1000);
route();
</script>
